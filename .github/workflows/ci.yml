name: checks
# Every pull request and every push to main: formatting, clippy and the tests of what the server is built from
# (the headless engine, horizon-server, horizon-prepare, the mod runtime), the offline tooling's tests and the
# public-tree check. Vanilla parity harnesses need Minecraft's own files and are not run here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Test runs never reach a telemetry server.
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: always

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep game files out of Git
        run: |
          python tools/check_public_tree.py
          python tools/check_public_tree.py --history
      - name: Offline tooling tests
        run: python -m unittest discover -s tests

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust and the ALSA and udev headers
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (server build)
        run: >-
          cargo clippy --release --locked -p horizon-client --no-default-features --features plugins --lib --bins
          -p horizon-server -p horizon-prepare -p horizon-mods -- -D warnings
      - name: Tests
        run: |
          cargo test --release --locked -p horizon-client --no-default-features --features plugins --lib
          cargo test --release --locked -p horizon-server --bin horizon-server
          cargo test --release --locked -p horizon-world --lib
          cargo test --release --locked -p horizon-release-sign
          cargo test --release --locked -p horizon-mods --features runtime --lib
      - name: The server builds
        run: |
          cargo build --release --locked -p horizon-client --no-default-features --features plugins --bin horizon-client
          cargo build --release --locked -p horizon-server --bin horizon-server -p horizon-prepare --bin horizon-prepare
