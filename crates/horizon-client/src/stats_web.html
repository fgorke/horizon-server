<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winterprojekt Statistiken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0b1020;
  --night-2: #121a31;
  --night-3: #1a2443;
  --line: #26325a;
  --frost: #e8eefc;
  --mist: #9aa8cc;
  --ice: #7fd6ff;
  --ice-deep: #3a8fd1;
  --ember: #ffb35c;
  --ember-deep: #e2742b;
  --moss: #6fe3a5;
  --blood: #ff6b7a;
  --radius-s: 6px;
  --radius-l: 18px;
  --display: "Fraunces", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --sans: "Inter", system-ui, sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html { background: var(--night); }
body {
  margin: 0;
  color: var(--frost);
  font: 15px/1.5 var(--sans);
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(127, 214, 255, 0.14), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(255, 179, 92, 0.08), transparent 60%),
    var(--night);
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background-image: radial-gradient(rgba(232, 238, 252, 0.5) 0.6px, transparent 0.8px);
  background-size: 46px 46px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 70%);
  opacity: 0.35;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 80px; position: relative; }

header.top {
  display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 16px;
  padding: 56px 0 28px; border-bottom: 1px solid var(--line);
}
.kicker { font: 600 12px/1 var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--ice); }
h1 {
  font: 800 clamp(44px, 8vw, 104px)/0.92 var(--display);
  letter-spacing: -0.03em; margin: 12px 0 0;
  background: linear-gradient(180deg, #fff 30%, #a9c4ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.live { font: 500 13px/1.4 var(--mono); color: var(--mist); text-align: right; }
.live b { color: var(--moss); font-weight: 600; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--moss); margin-right: 8px; box-shadow: 0 0 0 0 rgba(111, 227, 165, 0.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(111, 227, 165, 0); } 100% { box-shadow: 0 0 0 0 rgba(111, 227, 165, 0); } }

h2 { font: 600 28px/1.1 var(--display); margin: 52px 0 18px; letter-spacing: -0.01em; }
h2 small { font: 500 12px var(--mono); color: var(--mist); letter-spacing: 0.12em; margin-left: 12px; text-transform: uppercase; }

/* Leaderboards: a bento with one wide lead card. */
.boards { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.board {
  grid-column: span 4; background: linear-gradient(180deg, var(--night-2), rgba(18, 26, 49, 0.6));
  border: 1px solid var(--line); border-radius: var(--radius-l); padding: 18px 18px 14px;
  position: relative; overflow: hidden;
  transition: transform 0.4s var(--ease), border-color 0.3s;
}
.board:hover { transform: translateY(-3px); border-color: var(--ice-deep); }
.board.lead { grid-column: span 8; grid-row: span 2; padding: 26px; }
.board .label { font: 600 11px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--mist); }
.board .champ { display: flex; align-items: center; gap: 12px; margin: 14px 0 12px; }
.board .champ img { width: 40px; height: 40px; border-radius: 8px; image-rendering: pixelated; box-shadow: 0 0 0 2px var(--ember); }
.board.lead .champ img { width: 76px; height: 76px; border-radius: 12px; }
.board .champ .who { font: 600 16px var(--sans); }
.board.lead .champ .who { font: 800 34px/1 var(--display); }
.board .champ .val { font: 600 22px var(--mono); color: var(--ember); }
.board.lead .champ .val { font-size: 46px; line-height: 1; }
.board .champ .unit { font: 500 12px var(--mono); color: var(--mist); margin-left: 4px; }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.row .rank { font: 600 11px var(--mono); color: var(--mist); }
.row .bar { position: relative; height: 22px; border-radius: var(--radius-s); background: rgba(127, 214, 255, 0.06); overflow: hidden; }
.row .bar span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(58, 143, 209, 0.55), rgba(127, 214, 255, 0.35)); transform-origin: left; transition: transform 0.8s var(--ease); }
.row:first-child .bar span { background: linear-gradient(90deg, rgba(226, 116, 43, 0.6), rgba(255, 179, 92, 0.4)); }
.row .bar em { position: relative; font-style: normal; padding-left: 8px; line-height: 22px; }
.row .num { font: 500 12px var(--mono); color: var(--frost); }

/* Roster */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card {
  display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center;
  padding: 16px; border-radius: var(--radius-l); border: 1px solid var(--line);
  background: var(--night-2); transition: transform 0.35s var(--ease), background 0.3s, border-color 0.3s;
}
.card:hover { transform: translateY(-3px) rotate(-0.4deg); background: var(--night-3); border-color: var(--ice); }
.card:focus-visible, .tab:focus-visible, .back:focus-visible, input:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
.card img { width: 64px; height: 64px; border-radius: 10px; image-rendering: pixelated; }
.card .name { font: 600 19px/1.2 var(--display); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.on { background: var(--moss); box-shadow: 0 0 10px var(--moss); }
.card .meta { font: 400 12px/1.6 var(--mono); color: var(--mist); }

/* Player detail */
.back { display: inline-flex; gap: 8px; align-items: center; margin-top: 28px; font: 500 13px var(--mono); color: var(--mist); padding: 6px 10px; border-radius: var(--radius-s); }
.back:hover { color: var(--frost); background: var(--night-2); }
.hero { display: grid; grid-template-columns: 180px 1fr; gap: 32px; align-items: end; margin-top: 18px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.hero img { width: 180px; height: auto; image-rendering: pixelated; filter: drop-shadow(0 18px 30px rgba(127, 214, 255, 0.25)); }
.hero h1 { font-size: clamp(40px, 7vw, 88px); }
.hero .sub { font: 500 13px var(--mono); color: var(--mist); margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-l); overflow: hidden; margin-top: 28px; }
.fact { background: var(--night-2); padding: 16px 18px; }
.fact .v { font: 600 26px/1.1 var(--mono); }
.fact .k { font: 500 11px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mist); margin-top: 6px; }
.fact.hot .v { color: var(--ember); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 34px 0 14px; }
.tab { font: 500 13px var(--sans); color: var(--mist); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; transition: all 0.25s; }
.tab:hover { color: var(--frost); border-color: var(--ice-deep); }
.tab.on { color: var(--night); background: var(--ice); border-color: var(--ice); }
.tab .c { font: 400 11px var(--mono); opacity: 0.7; margin-left: 6px; }
.filter { width: 100%; max-width: 340px; padding: 10px 14px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--night-2); color: var(--frost); font: 14px var(--sans); margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 7px 10px; border-bottom: 1px solid rgba(38, 50, 90, 0.6); font-size: 14px; }
td.n { font-family: var(--mono); text-align: right; width: 120px; }
td.b { width: 40%; }
td.b div { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--ice-deep), var(--ice)); }
tr:hover td { background: rgba(127, 214, 255, 0.04); }
.empty { color: var(--mist); font: 13px var(--mono); padding: 18px 0; }
footer { margin-top: 70px; color: var(--mist); font: 12px var(--mono); }

@media (max-width: 820px) {
  .board, .board.lead { grid-column: span 12; grid-row: auto; }
  header.top { grid-template-columns: 1fr; }
  .live { text-align: left; }
  .hero { grid-template-columns: 1fr; }
  .hero img { width: 120px; }
  td.b { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">Server-Almanach</div>
      <h1>Winterprojekt</h1>
    </div>
    <div class="live" id="live">lädt…</div>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer>Statistiken der Spieler, live für alle, die gerade online sind.</footer>
</div>
<script>
"use strict";
const CM_PER_KM = 100000;
const TICKS_PER_HOUR = 72000;
const POLL_MS = 5000;
const CAT = {
  "minecraft:mined": "Abgebaut",
  "minecraft:used": "Benutzt",
  "minecraft:crafted": "Hergestellt",
  "minecraft:broken": "Kaputt gegangen",
  "minecraft:picked_up": "Aufgehoben",
  "minecraft:dropped": "Fallengelassen",
  "minecraft:killed": "Getötet",
  "minecraft:killed_by": "Getötet von",
  "minecraft:custom": "Allgemein",
};
const CUSTOM = {
  play_time: "Spielzeit", deaths: "Tode", mob_kills: "Mob-Kills", player_kills: "Spieler-Kills",
  jump: "Sprünge", damage_dealt: "Schaden ausgeteilt", damage_taken: "Schaden erhalten",
  walk_one_cm: "Gelaufen", sprint_one_cm: "Gesprintet", crouch_one_cm: "Geschlichen",
  swim_one_cm: "Geschwommen", fall_one_cm: "Gefallen", fly_one_cm: "Geflogen", aviate_one_cm: "Mit Elytra geflogen",
  boat_one_cm: "Boot gefahren", horse_one_cm: "Geritten", minecart_one_cm: "Lore gefahren",
  climb_one_cm: "Geklettert", walk_on_water_one_cm: "Auf Wasser gelaufen", walk_under_water_one_cm: "Unter Wasser gelaufen",
  leave_game: "Spiel verlassen", time_since_death: "Zeit seit letztem Tod", time_since_rest: "Zeit seit letztem Schlaf",
  sneak_time: "Geschlichen (Zeit)", total_world_time: "Zeit in der Welt", open_chest: "Truhen geöffnet",
  open_enderchest: "Endertruhen geöffnet", drop: "Items gedroppt", sleep_in_bed: "Im Bett geschlafen",
  traded_with_villager: "Mit Dorfbewohnern gehandelt", enchant_item: "Items verzaubert", fish_caught: "Fische gefangen",
  animals_bred: "Tiere gezüchtet", eat_cake_slice: "Kuchenstücke gegessen", interact_with_crafting_table: "Werkbank benutzt",
  interact_with_furnace: "Ofen benutzt", interact_with_anvil: "Amboss benutzt", raid_win: "Überfälle gewonnen",
  bell_ring: "Glocke geläutet", target_hit: "Zielblock getroffen", play_record: "Schallplatten abgespielt",
};
const BOARDS = [
  { key: "play", label: "Spielzeit", unit: "h", lead: true, get: s => c(s, "play_time") / TICKS_PER_HOUR, digits: 1 },
  { key: "mined", label: "Abgebaute Blöcke", unit: "", get: s => sum(s, "minecraft:mined") },
  { key: "walk", label: "Zu Fuß", unit: "km", get: s => (c(s, "walk_one_cm") + c(s, "sprint_one_cm") + c(s, "crouch_one_cm")) / CM_PER_KM, digits: 1 },
  { key: "elytra", label: "Elytra-Flug", unit: "km", get: s => c(s, "aviate_one_cm") / CM_PER_KM, digits: 1 },
  { key: "mobs", label: "Mob-Kills", unit: "", get: s => c(s, "mob_kills") },
  { key: "pvp", label: "Spieler-Kills", unit: "", get: s => c(s, "player_kills") },
  { key: "deaths", label: "Tode", unit: "", get: s => c(s, "deaths") },
  { key: "crafted", label: "Hergestellt", unit: "", get: s => sum(s, "minecraft:crafted") },
  { key: "damage", label: "Schaden ausgeteilt", unit: "♥", get: s => c(s, "damage_dealt") / 20, digits: 0 },
];

let players = [];
let lastUpdate = 0;
let tab = "minecraft:mined";
let query = "";

const c = (s, k) => ((s && s["minecraft:custom"]) || {})["minecraft:" + k] || 0;
const sum = (s, cat) => Object.values((s && s[cat]) || {}).reduce((a, b) => a + b, 0);
const fmt = (n, d = 0) => n.toLocaleString("de-DE", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const esc = t => String(t).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const head = (p, size = 64) => `https://mc-heads.net/avatar/${encodeURIComponent(p.uuid)}/${size}`;
const human = id => id.replace(/^minecraft:/, "").split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");

function customValue(key, v) {
  const k = key.replace(/^minecraft:/, "");
  if (k.endsWith("_one_cm")) return fmt(v / CM_PER_KM, 2) + " km";
  if (k.endsWith("_time") || k.startsWith("time_since")) return fmt(v / TICKS_PER_HOUR, 1) + " h";
  if (k.startsWith("damage_")) return fmt(v / 20, 0) + " ♥";
  return fmt(v);
}

function boardHtml(b) {
  const ranked = players.map(p => ({ p, v: b.get(p.stats) })).filter(r => r.v > 0).sort((x, y) => y.v - x.v);
  if (!ranked.length) {
    return `<section class="board${b.lead ? " lead" : ""}"><div class="label">${esc(b.label)}</div><p class="empty">Noch niemand.</p></section>`;
  }
  const top = ranked[0];
  const max = top.v;
  const rows = ranked.slice(0, b.lead ? 6 : 3).map((r, i) => `
    <div class="row"><span class="rank">${i + 1}</span>
      <div class="bar"><span style="transform:scaleX(${(r.v / max).toFixed(4)})"></span><em>${esc(r.p.name)}</em></div>
      <span class="num">${fmt(r.v, b.digits || 0)}</span></div>`).join("");
  return `<section class="board${b.lead ? " lead" : ""}">
    <div class="label">${esc(b.label)}</div>
    <a class="champ" href="#/${encodeURIComponent(top.p.uuid)}">
      <img src="${head(top.p, b.lead ? 96 : 48)}" alt="" width="40" height="40" loading="lazy">
      <div><div class="who">${esc(top.p.name)}</div>
      <div><span class="val">${fmt(top.v, b.digits || 0)}</span><span class="unit">${esc(b.unit)}</span></div></div>
    </a>
    <div class="rows">${rows}</div></section>`;
}

function overview() {
  const sorted = [...players].sort((a, b) => (b.online - a.online) || (c(b.stats, "play_time") - c(a.stats, "play_time")));
  const cards = sorted.map(p => `
    <a class="card" href="#/${encodeURIComponent(p.uuid)}">
      <img src="${head(p)}" alt="" width="64" height="64" loading="lazy">
      <div><div class="name"><span class="dot${p.online ? " on" : ""}" title="${p.online ? "online" : "offline"}"></span>${esc(p.name)}</div>
      <div class="meta">${fmt(c(p.stats, "play_time") / TICKS_PER_HOUR, 1)} h gespielt<br>${fmt(c(p.stats, "mob_kills"))} Kills · ${fmt(c(p.stats, "deaths"))} Tode</div></div>
    </a>`).join("");
  return `<h2>Spitzenreiter<small>live</small></h2>
    <div class="boards">${BOARDS.map(boardHtml).join("")}</div>
    <h2>Spieler<small>${players.length}</small></h2>
    <div class="roster">${cards || '<p class="empty">Noch keine Statistiken.</p>'}</div>`;
}

function categoryRows(p) {
  const entries = Object.entries((p.stats && p.stats[tab]) || {})
    .map(([k, v]) => [k, v, tab === "minecraft:custom" ? (CUSTOM[k.replace(/^minecraft:/, "")] || human(k)) : human(k)])
    .filter(([, , name]) => name.toLowerCase().includes(query.toLowerCase()))
    .sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<p class="empty">Nichts gefunden.</p>';
  const max = entries[0][1] || 1;
  return `<table><tbody>${entries.map(([k, v, name]) => `<tr>
    <td>${esc(name)}</td><td class="b"><div style="width:${Math.max(2, (v / max) * 100).toFixed(1)}%"></div></td>
    <td class="n">${tab === "minecraft:custom" ? customValue(k, v) : fmt(v)}</td></tr>`).join("")}</tbody></table>`;
}

function detail(p) {
  const s = p.stats;
  const kills = c(s, "mob_kills") + c(s, "player_kills");
  const deaths = c(s, "deaths");
  const facts = [
    ["Spielzeit", fmt(c(s, "play_time") / TICKS_PER_HOUR, 1) + " h", true],
    ["Abgebaut", fmt(sum(s, "minecraft:mined"))],
    ["Hergestellt", fmt(sum(s, "minecraft:crafted"))],
    ["Mob-Kills", fmt(c(s, "mob_kills"))],
    ["Spieler-Kills", fmt(c(s, "player_kills"))],
    ["Tode", fmt(deaths)],
    ["K/D", deaths ? fmt(kills / deaths, 2) : fmt(kills)],
    ["Zu Fuß", fmt((c(s, "walk_one_cm") + c(s, "sprint_one_cm") + c(s, "crouch_one_cm")) / CM_PER_KM, 1) + " km"],
    ["Elytra", fmt(c(s, "aviate_one_cm") / CM_PER_KM, 1) + " km"],
    ["Sprünge", fmt(c(s, "jump"))],
  ];
  const tabs = Object.keys(CAT).map(k => {
    const n = Object.keys((s && s[k]) || {}).length;
    return `<button class="tab${k === tab ? " on" : ""}" data-tab="${k}">${CAT[k]}<span class="c">${n}</span></button>`;
  }).join("");
  return `<a class="back" href="#/">← Alle Spieler</a>
    <section class="hero">
      <img src="https://mc-heads.net/body/${encodeURIComponent(p.uuid)}/180" alt="Skin von ${esc(p.name)}" width="180" height="432">
      <div><div class="kicker">${p.online ? "● online" : "offline"}</div><h1>${esc(p.name)}</h1>
      <div class="sub">${esc(p.uuid)}</div></div>
    </section>
    <div class="facts">${facts.map(([k, v, hot]) => `<div class="fact${hot ? " hot" : ""}"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div>
    <div class="tabs" role="tablist">${tabs}</div>
    <input class="filter" id="filter" placeholder="Filtern…" value="${esc(query)}" aria-label="Einträge filtern">
    <div id="rows">${categoryRows(p)}</div>`;
}

function render() {
  const view = document.getElementById("view");
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const p = players.find(x => x.uuid === id);
  if (id && p) {
    const focused = document.activeElement && document.activeElement.id === "filter";
    view.innerHTML = detail(p);
    const filter = document.getElementById("filter");
    filter.addEventListener("input", e => { query = e.target.value; document.getElementById("rows").innerHTML = categoryRows(p); });
    if (focused) { filter.focus(); filter.setSelectionRange(query.length, query.length); }
    view.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; query = ""; render(); }));
  } else {
    view.innerHTML = overview();
  }
  const online = players.filter(x => x.online).length;
  document.getElementById("live").innerHTML = `<span class="pulse"></span><b>${online}</b> online · ${players.length} Spieler<br>aktualisiert ${new Date(lastUpdate).toLocaleTimeString("de-DE")}`;
}

async function load() {
  try {
    const r = await fetch("api/stats", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    players = await r.json();
    lastUpdate = Date.now();
    render();
  } catch (e) {
    document.getElementById("live").textContent = "Server nicht erreichbar, neuer Versuch…";
  }
}
window.addEventListener("hashchange", () => { query = ""; render(); window.scrollTo(0, 0); });
load();
setInterval(load, POLL_MS);
</script>
</body>
</html>
