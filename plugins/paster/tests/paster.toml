# The mod says hi and hears what the server takes; operators' lines run in their dimension, at
# their place. Nobody else's do, and nothing but /setblock and /summon.

[[step]]
join = "Alex"
payload = { channel = "litematica-server-paster:network_v2", data = "000a08000b6d6f645f76657273696f6e0005302e312e3000" }
expect.payloads = ["Alex: litematica-server-paster:network_v2 000a08000b6d6f645f76657273696f6e0005302e312e3000", "Alex: litematica-server-paster:network_v2 010a0b000369647300000005000000000000000100000002000000030000000400"]

[[step]]
player = { x = 0.5, y = 64.0, z = 0.5, permission = 0 }
payload = { channel = "litematica-server-paster:network_v2", data = "010a0800046368617400292f736574626c6f636b203120322033206d696e6563726166743a63686573747b4c6f636b3a2278227d00" }
expect.quiet = []
expect.told = ["Alex: §cLitematica paste refused: you need to be an operator."]

# Told once: a paste sends thousands of lines.
[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "010a0800046368617400292f736574626c6f636b203120322033206d696e6563726166743a63686573747b4c6f636b3a2278227d00" }
expect.quiet = []
expect.told = []

# A long command from someone else gathers nothing.
[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "020a00" }
expect.told = []

[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "040a00" }
expect.quiet = []

[[step]]
player = { permission = 2 }
payload = { channel = "litematica-server-paster:network_v2", data = "010a0800046368617400292f736574626c6f636b203120322033206d696e6563726166743a63686573747b4c6f636b3a2278227d00" }
expect.quiet = ['execute in minecraft:overworld positioned 0.5 64 0.5 run setblock 1 2 3 minecraft:chest{Lock:"x"} strict']
expect.told = []

[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "010a0800046368617400082f6f7020416c657800" }
expect.quiet = []
expect.told = ["Alex: §cLitematica paste refused: only /setblock and /summon are allowed."]

[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "020a00" }
expect.quiet = []

[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "" }
expect.quiet = []

[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "030a0800077365676d656e740002227d00" }
expect.quiet = []

[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "040a00" }
expect.quiet = ['execute in minecraft:overworld positioned 0.5 64 0.5 run setblock 4 5 6 minecraft:chest{Lock:""} strict']

# A damaged packet changes nothing, and stops nothing.
[[step]]
payload = { channel = "litematica-server-paster:network_v2", data = "01 0a 08" }
expect.quiet = []
